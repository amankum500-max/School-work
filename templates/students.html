{% extends "base.html" %}
{% block content %}
<h2>🎓 Students</h2>

<form method="GET" class="card" style="display:flex; gap:8px;">
  <input name="q" value="{{ q }}" placeholder="Search by name or roll no">
  <button>🔍</button>
</form>

<div class="card">
  <h3>➕ Add Student</h3>
  <form method="POST" action="{{ url_for('add_student') }}">
    <input name="roll_no" placeholder="Roll No" required>
    <input name="name" placeholder="Full Name" required>
    <input name="father" placeholder="Father Name">
    <input name="mother" placeholder="Mother Name">
    <input name="class_name" placeholder="Class">
    <input name="section" placeholder="Section">
    <select name="gender"><option>Male</option><option>Female</option></select>
    <input name="dob" placeholder="DOB (YYYY-MM-DD)">
    <input name="contact" placeholder="Contact">
    <input name="parent_contact" placeholder="Parent Contact (WhatsApp)">
    <input name="address" placeholder="Address">
    <input name="admission_date" placeholder="Admission Date">
    <input name="transport_route" placeholder="Transport Route">
    <select name="hostel"><option value="">No Hostel</option><option value="Y">Hostel</option></select>
    <button class="green">Save Student</button>
  </form>
</div>

<div class="card">
  <h3>📋 All Students ({{ students|length }})</h3>
  <table>
    <tr><th>Roll</th><th>Name</th><th>Class</th><th>Contact</th><th></th></tr>
    {% for s in students %}
    <tr>
      <td>{{ s['roll_no'] }}</td>
      <td>{{ s['name'] }}</td>
      <td>{{ s['class_name'] }}-{{ s['section'] }}</td>
      <td>{{ s['contact'] }}</td>
      <td><a class="btn red" href="{{ url_for('delete_student', sid=s['id']) }}"
             onclick="return confirm('Delete?')">🗑️</a></td>
    </tr>
    {% endfor %}
  </table>
</div>
{% endblock %}
