{% extends "base.html" %}
{% block content %}
<h2>📖 Homework Management</h2>
<div class="card">
    <h3>Naya Homework Add Karein</h3>
    <form method="POST">
        <input type="text" name="class_name" placeholder="Class (e.g., 10th)" required>
        <input type="text" name="subject" placeholder="Subject" required>
        <textarea name="description" placeholder="Homework Details..." required></textarea>
        <label>Due Date:</label>
        <input type="date" name="due_date" required>
        <button type="submit" class="btn btn-primary">Add Homework</button>
    </form>
</div>
<div class="card">
    <h3>Saare Homework</h3>
    <table>
        <tr><th>Class</th><th>Subject</th><th>Homework</th><th>Due Date</th></tr>
        {% for hw in homework %}
        <tr>
            <td>{{ hw.class_name }}</td>
            <td>{{ hw.subject }}</td>
            <td>{{ hw.description }}</td>
            <td>{{ hw.due_date }}</td>
        </tr>
        {% endfor %}
    </table>
</div>
{% endblock %}
