{% extends "base.html" %}
{% block content %}
<h2>💸 Expenses</h2>

<div class="card">
  <form method="POST">
    <select name="category">
      <option>Salary</option><option>Rent</option><option>Electricity</option>
      <option>Maintenance</option><option>Transport</option><option>Misc</option>
    </select>
    <input name="description" placeholder="Description">
    <input name="amount" type="number" placeholder="Amount">
    <input name="exp_date" type="date" value="{{ '' }}">
    <input name="staff_id" placeholder="Staff ID (optional)">
    <button class="green">➕ Add Expense</button>
  </form>
</div>

<div class="card">
  <table>
    <tr><th>Date</th><th>Category</th><th>Description</th><th>Amount</th></tr>
    {% for e in expenses %}
    <tr>
      <td>{{ e['exp_date'] }}</td>
      <td>{{ e['category'] }}</td>
      <td>{{ e['description'] }}</td>
      <td>₹{{ '{:,.0f}'.format(e['amount']) }}</td>
    </tr>
    {% endfor %}
  </table>
</div>
{% endblock %}
