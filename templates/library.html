{% extends 'base.html' %} <!-- Agar aapne base.html banaya hai -->
{% block content %}
<h2>📚 Library Management</h2>
<a href="#" class="btn btn-primary">Add New Book</a>
<table class="table">
    <tr><th>Book Name</th><th>Author</th><th>Available</th></tr>
    {% for book in books %}
    <tr>
        <td>{{ book.book_name }}</td>
        <td>{{ book.author }}</td>
        <td>{{ book.available_copies }} / {{ book.total_copies }}</td>
    </tr>
    {% endfor %}
</table>
{% endblock %}
